[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jupy-interop"
version = "0.0.0"
description = "Experimental persistent Julia-Python runtime for jupy-cli"
requires-python = ">=3.11"
dependencies = ["juliacall>=0.9.22,<0.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jupy*"]
