name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.8"
          - "3.13"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check version consistency
        run: >
          python -c "from pathlib import Path; import ast;
          tree=ast.parse(Path('core/jupy_core.py').read_text());
          tool=next(n.value.value for n in tree.body
          if isinstance(n, ast.Assign)
          and any(isinstance(t, ast.Name) and t.id == 'TOOL_VERSION' for t in n.targets));
          version=Path('VERSION').read_text().strip();
          assert tool == version, f'TOOL_VERSION={tool} does not match VERSION={version}'"

      - name: Compile Python cores
        run: >
          python -m py_compile
          core/jupy_core.py
          core/jupy_update.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: >
          bash -n
          bin/jupy
          bin/jupip
          bin/jupyup
          install.sh
          uninstall.sh

      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          expected="v$(tr -d '\r\n' < VERSION)"

          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
              echo "Tag/version mismatch:"
              echo "  tag:      $GITHUB_REF_NAME"
              echo "  expected: $expected"
              exit 1
          fi
