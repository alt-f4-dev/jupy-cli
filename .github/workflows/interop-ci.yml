name: Interoperability runtime
on:
  push:
    branches: [interop]
  pull_request:
    paths: ['python/**', 'julia/**', 'tests/interop/**', '.github/workflows/interop-ci.yml', 'core/**']
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q python/jupy tests/interop
      - run: python -m unittest discover -s tests/interop -p 'test_*.py' -v
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - run: python -m pip install -e ./python
      - name: Provision Julia test project
        shell: bash
        run: |
          julia --startup-file=no --project=tests/interop/julia-project -e 'using Pkg; Pkg.add(PackageSpec(name="PythonCall", version="0.9.37")); Pkg.develop(path=abspath("julia/Jupy")); Pkg.instantiate()'
      - name: Python hosted Julia
        run: python tests/interop/smoke_python_to_julia.py
      - name: Julia hosted Python
        shell: bash
        env:
          JULIA_CONDAPKG_BACKEND: 'Null'
          JULIA_PYTHONCALL_EXE: '@venv'
        run: julia --startup-file=no --project=tests/interop/julia-project tests/interop/smoke_julia_to_python.jl
