name: Interoperability runtime
on:
  push:
    branches: [interop]
  pull_request:
    paths: ['python/**', 'julia/**', 'tests/interop/**', '.github/workflows/interop-ci.yml', 'core/**']
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q python/jupy tests/interop
      - run: python -m unittest discover -s tests/interop -p 'test_*.py' -v
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - run: python -m pip install -e ./python
      - name: Provision Julia test project
        shell: bash
        run: |
          julia --startup-file=no --project=tests/interop/julia-project -e 'using Pkg; Pkg.add(PackageSpec(name="PythonCall", version="0.9.37")); Pkg.develop(path=abspath("julia/Jupy")); Pkg.instantiate()'
      - name: Python hosted Julia
        run: python tests/interop/smoke_python_to_julia.py
      - name: Bind PythonCall to active Python interpreter
        shell: bash
        run: |
          echo "JULIA_PYTHONCALL_EXE=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Julia hosted Python
        shell: bash
        env:
          JULIA_CONDAPKG_BACKEND: 'Null'
        run: julia --startup-file=no --project=tests/interop/julia-project tests/interop/smoke_julia_to_python.jl

  cli-installation:
    name: CLI setup (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [jupy, juuv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Provision via CLI entry point
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p "$RUNNER_TEMP/jupy-interop-probe"
          cd "$RUNNER_TEMP/jupy-interop-probe"
          python "$GITHUB_WORKSPACE/core/jupy_core.py" "$BACKEND" --jupy-interop-setup
      - name: Assert package setup and persistence
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          cd "$RUNNER_TEMP/jupy-interop-probe"
          test -f .jupy-interop/python/jupy/runtime.py
          test -f .jupy-interop/julia/Jupy/src/Jupy.jl
          if [ "$BACKEND" = juuv ]; then
            test -f uv.lock
            test ! -f requirements.txt
          else
            test -f requirements.txt
          fi
          .venv/bin/python -c "from jupy import JuliaRuntime; from pathlib import Path; r=JuliaRuntime(project=Path.cwd()); m=r.import_module('ExampleInterop', path=Path('$GITHUB_WORKSPACE/tests/interop/ExampleInterop.jl')); assert m.increment(7)==8; assert m.increment(8)==9; assert m.calls()==2; assert r.initialized"
          python "$GITHUB_WORKSPACE/core/jupy_core.py" "$BACKEND" -e 'using Jupy; @assert Jupy.pyimport("sys") === Jupy.pyimport("sys")'
